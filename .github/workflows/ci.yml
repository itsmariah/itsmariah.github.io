name: CI

# Checagem de tipos e testes. Roda em pull requests e em branches que não são a main;
# na main, o deploy.yml chama este mesmo workflow antes de publicar.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Tipos e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # O typescript-eslint ainda não suporta o TypeScript 7; a checagem estrita do tsc faz o papel do lint
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  <!-- Aplica tema e idioma antes do primeiro paint (evita flash) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('portfolio-lang');
        if (lang !== 'pt' && lang !== 'en') lang = navigator.language.toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';
        if (lang === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    })();
  </script>
  <!-- A foto do hero é o maior elemento da primeira tela: começa a baixar antes do JavaScript -->
  <link
    rel="preload"
    as="image"
    type="image/avif"
    imagesrcset="/assets/images/foto_profissional-400.avif 400w, /assets/images/foto_profissional-720.avif 720w"
    imagesizes="(max-width: 600px) 200px, (max-width: 960px) 300px, 360px"
    fetchpriority="high"
